name: Test and deploy game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active publication before publishing the next main revision.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Vite reads package.json and this checkout's Git hash into version.json.
      - run: npm run build
      - run: npm run build:kids
      - run: node scripts/check-editions.mjs
      - name: Preserve kids artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-site
          path: dist-kids
      - name: Check build identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/version.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(manifest.version, pkg.version);
          assert.equal(manifest.gitHash, process.env.GITHUB_SHA.slice(0, 12));
          JS
      - name: Package isolated services
        run: |
          cp dist-kids/version.json server/release.json
          tar -czf bnb-deploy.tgz server src package.json LICENSE dist-kids
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-services
          path: bnb-deploy.tgz
      - name: Upload game
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vps:
    name: Publish isolated API and kids site
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bnb-services
      - name: Publish tested artifact
        env:
          BNB_DEPLOY_KEY: ${{ secrets.BNB_DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$BNB_DEPLOY_KEY" > "$RUNNER_TEMP/bnb-key"
          trap 'rm -f "$RUNNER_TEMP/bnb-key"' EXIT
          ssh -F /dev/null -i "$RUNNER_TEMP/bnb-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts bnb-deploy@212.227.21.239 "deploy $GITHUB_SHA" < bnb-deploy.tgz
